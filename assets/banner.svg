ty=".08"><path stroke="#FFF" stroke-width="1" d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200"/><path stroke="#FFF" stroke-width="1" d="M120 0 V360 M240 0 V360 M360 0 V360 M480 0 V360 M600 0 V360 M720 0 V360 M840 0 V360 M960 0 V360 M1080 0 V360"/></g><g class="pulsing-bg"><path d="M 100 280 Q 300 320 600 280 T 1100 290" class="pulse-line" opacity=".4"/><path d="M 50 60 Q 400 20 800 70 T 1150 50" class="pulse-line" opacity=".3"/></g><g filter="url(#glow)"><path fill="none" stroke="#312E81" stroke-width="3" d="M 80 290 L 320 290 L 480 220 L 720 220 L 880 290 L 1120 290"/><path fill="none" stroke="#38BDF8" stroke-width="4" d="M 80 290 L 320 290 L 480 220 L 720 220 L 880 290 L 1120 290" class="animated-packet"/><path fill="none" stroke="#1E1B4B" stroke-width="3" d="M 80 70 L 280 70 L 440 140 L 760 140 L 920 70 L 1120 70"/><path fill="none" stroke="#C084FC" stroke-width="4" d="M 80 70 L 280 70 L 440 140 L 760 140 L 920 70 L 1120 70" class="animated-packet" style="animation-delay:-3s"/></g><g class="floating"><circle cx="150" cy="70" r="10" class="node"/><circle cx="1050" cy="70" r="10" class="node"/><circle cx="150" cy="290" r="10" class="node-active"/><circle cx="1050" cy="290" r="10" class="node-active"/></g><rect width="840" height="210" x="180" y="75" fill="#0F172A" fill-opacity=".75" stroke="#334155" stroke-width="1.5" filter="drop-shadow(0px 12px 24px rgba(0,0,0,0.5))" rx="16"/><g transform="translate(480, 96)"><rect width="240" height="28" x="0" y="0" fill="#1E293B" stroke="#38BDF8" stroke-width="1" rx="14"/><text x="120" y="19" class="badge-text" text-anchor="middle">⚡ MQaaS &amp; STREAMING ECOSYSTEM</text></g><text x="600" y="172" class="title" text-anchor="middle">AWESOME MESSAGE QUEUE</text><text x="600" y="218" class="title" text-anchor="middle" style="font-size:36px;fill:#f8fafc">AS A SERVICE</text><text x="600" y="258" class="subtitle" text-anchor="middle">Managed MQaaS, Pub/Sub Platforms, Event Streaming &amp; Open-Source Alternatives</t