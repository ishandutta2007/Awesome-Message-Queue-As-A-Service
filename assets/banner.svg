<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E17"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1F1937"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Glowing Lines Gradient -->
    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      font-weight: 900;
      font-size: 46px;
      fill: url(#textGrad);
      letter-spacing: 2px;
    }
    .subtitle {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #E2E8F0;
      letter-spacing: 1px;
    }
    .badge-text {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      font-weight: 700;
      font-size: 13px;
      fill: #38BDF8;
    }
    .pulse-line {
      stroke: url(#lineGrad1);
      stroke-width: 3;
      stroke-linecap: round;
      fill: none;
    }
    .node {
      fill: #1E293B;
      stroke: #818CF8;
      stroke-width: 2.5;
      filter: drop-shadow(0px 0px 8px rgba(129, 140, 248, 0.6));
    }
    .node-active {
      fill: #0F172A;
      stroke: #38BDF8;
      stroke-width: 3;
      filter: drop-shadow(0px 0px 12px rgba(56, 189, 248, 0.8));
    }
    
    /* Dynamic Animation aspect */
    @keyframes movePacket {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatNode {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.8; }
    }
    .animated-packet {
      stroke-dasharray: 20 580;
      animation: movePacket 6s linear infinite;
    }
    .floating {
      animation: floatNode 4s ease-in-out infinite;
    }
    .pulsing-bg {
      animation: pulseGlow 5s ease-in-out infinite;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Background Pattern -->
  <g opacity="0.08">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200" stroke="#FFFFFF" stroke-width="1"/>
    <path d="M120 0 V360 M240 0 V360 M360 0 V360 M480 0 V360 M600 0 V360 M720 0 V360 M840 0 V360 M960 0 V360 M1080 0 V360" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- Background Dynamic Mesh Network Lines (Kept in Background under z-index hierarchy) -->
  <g class="pulsing-bg">
    <path d="M 100 280 Q 300 320 600 280 T 1100 290" class="pulse-line" opacity="0.4"/>
    <path d="M 50 60 Q 400 20 800 70 T 1150 50" class="pulse-line" opacity="0.3"/>
  </g>

  <!-- Message Queue Pipeline Flow (Dynamic Animated Packets) -->
  <g filter="url(#glow)">
    <!-- Data Stream Line 1 -->
    <path d="M 80 290 L 320 290 L 480 220 L 720 220 L 880 290 L 1120 290" fill="none" stroke="#312E81" stroke-width="3" />
    <path d="M 80 290 L 320 290 L 480 220 L 720 220 L 880 290 L 1120 290" fill="none" stroke="#38BDF8" stroke-width="4" class="animated-packet" />

    <!-- Data Stream Line 2 -->
    <path d="M 80 70 L 280 70 L 440 140 L 760 140 L 920 70 L 1120 70" fill="none" stroke="#1E1B4B" stroke-width="3" />
    <path d="M 80 70 L 280 70 L 440 140 L 760 140 L 920 70 L 1120 70" fill="none" stroke="#C084FC" stroke-width="4" class="animated-packet" style="animation-delay: -3s;" />
  </g>

  <!-- Background Decorative Nodes (Kept low opacity & outside center text zone) -->
  <g class="floating">
    <circle cx="150" cy="70" r="10" class="node"/>
    <circle cx="1050" cy="70" r="10" class="node"/>
    <circle cx="150" cy="290" r="10" class="node-active"/>
    <circle cx="1050" cy="290" r="10" class="node-active"/>
  </g>

  <!-- Center Card Backdrop for Guaranteed Foreground Text Readability -->
  <rect x="180" y="75" width="840" height="210" rx="16" fill="#0F172A" fill-opacity="0.75" stroke="#334155" stroke-width="1.5" filter="drop-shadow(0px 12px 24px rgba(0,0,0,0.5))"/>

  <!-- Top Pill Badge -->
  <g transform="translate(480, 96)">
    <rect x="0" y="0" width="240" height="28" rx="14" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text x="120" y="19" text-anchor="middle" class="badge-text">⚡ MQaaS &amp; STREAMING ECOSYSTEM</text>
  </g>

  <!-- Title (Foreground) -->
  <text x="600" y="172" text-anchor="middle" class="title">AWESOME MESSAGE QUEUE</text>
  <text x="600" y="218" text-anchor="middle" class="title" style="font-size: 36px; fill: #F8FAFC;">AS A SERVICE</text>

  <!-- Subtitle (Foreground) -->
  <text x="600" y="258" text-anchor="middle" class="subtitle">Managed MQaaS, Pub/Sub Platforms, Event Streaming &amp; Open-Source Alternatives</text>
</svg>
